$kind: http-example
request:
  url: "{{baseUrl}}/api/reviews"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "repairRequestId": 126235878,
        "rating": 4,
        "comment": "string",
        "technicianId": 8961,
        "imageUrls": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
